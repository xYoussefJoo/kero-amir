# Local stack for anyone with Docker: `docker compose up`.
# Without Docker, point ConnectionStrings__Sql at a local SQL Server instead (see CLAUDE.md).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Local_dev_only_1}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: src/KeroAmir.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Sql: "Server=sqlserver;Database=KeroAmir;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Local_dev_only_1};TrustServerCertificate=True"
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqldata:
